name: Update streak stats

on:
  schedule:
    - cron: "0 16 * * *"
  push:
    branches: [main]
    paths-ignore:
      - "assets/github-streak.svg"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Generate streak stats
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          path: assets/github-streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          options: "user=juneabayabay&timezone=Asia/Manila&hide_border=false&background=0B0614&border=D4AF37&stroke=D4AF37&ring=D4AF37&fire=FFD700&currStreakNum=FFF8E7&sideNums=D4AF37&currStreakLabel=D4AF37&sideLabels=C9D1D9&dates=8B949E&disable_animations=true"

      - name: Commit streak stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-streak.svg
          git commit -m "Update streak stats" || exit 0
          git push
