<svg xmlns="http://www.w3.org/2000/svg" width="980" height="340" viewBox="0 0 980 340" role="img" aria-label="Barnabas Dental Clinic Management System">
  <defs>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1F6FEB"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
    <linearGradient id="fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0614"/>
      <stop offset="100%" stop-color="#1A1208"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="964" height="324" rx="24" fill="url(#fill)" stroke="url(#border)" stroke-width="3"/>
  <rect x="318" y="42" width="118" height="32" rx="16" fill="#D4AF37"/>
  <text x="377" y="63" text-anchor="middle" fill="#111111" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700">FEATURED</text>
  <rect x="448" y="42" width="214" height="32" rx="16" fill="none" stroke="#D4AF37"/>
  <text x="555" y="63" text-anchor="middle" fill="#D4AF37" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700">CAPSTONE · CAINTA</text>
